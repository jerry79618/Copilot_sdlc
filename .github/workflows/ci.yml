name: SDLC Contract and Demo Verification
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q sdlc tests
      - name: Run framework unit tests and routing evaluations
        run: python -m unittest discover -s tests -v
      - name: Validate bank model policy and deterministic token estimates
        run: |
          python -m sdlc.model_policy check
          python -m sdlc.model_policy route --task contracts/examples/banking-high-risk.json
          python -m sdlc.credit_estimate --scenario all
      - name: Verify pstack-inspired routing, Feature Map health and static evaluation
        run: |
          python -m sdlc.discovery inspect
          python -m sdlc.discovery health
          python -m sdlc.quality_eval
      - name: Verify cross-project Playbook bootstrap
        run: |
          python -m sdlc.entrypoint doctor --project-root .
          python -m sdlc.entrypoint route --project-root . --goal "新增訂單查詢"
      - name: Validate playbook catalog and route
        run: |
          python -m sdlc.mode catalog
          python -m sdlc.mode route --goal "測試跨系統人工覆核"
      - name: Validate example contracts
        run: |
          python -m sdlc.cli validate --task contracts/examples/verification.json
          python -m sdlc.cli validate --task contracts/examples/verification-low-risk.json
          python -m sdlc.cli validate --task contracts/examples/development.json
          python -m sdlc.cli validate --task contracts/examples/investigation.json
      - name: Check worklist creation and scenario execution
        run: |
          python -m sdlc.mode start --task contracts/examples/verification.json
          python -m sdlc.mode start --task contracts/examples/verification-low-risk.json
          python -m sdlc.mode start --task contracts/examples/development.json
          python -m sdlc.cli plan --task contracts/examples/development.json
          python -m sdlc.cli verify --task contracts/examples/verification.json --output-dir artifacts
      - name: Upload synthetic evidence and worklists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-verification-evidence
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

  cucumber-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: cucumber/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Feature Map bindings
        run: python -m sdlc.feature_map validate
      - name: Execute Cucumber JVM
        run: mvn -B -ntp -f cucumber/pom.xml test
      - name: Produce normalized SDLC verification evidence
        run: |
          python -m sdlc.cucumber_evidence --task contracts/examples/verification.json --feature manual-review
          python -c "import json; x=json.load(open('artifacts/cucumber-evidence.json')); assert x['status']=='PASS' and x['classification']=='CUCUMBER_DEMO_VERIFIED'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-bdd-evidence
          path: |
            cucumber/target/cucumber-report/
            artifacts/cucumber-evidence.json
          if-no-files-found: ignore
          retention-days: 7
